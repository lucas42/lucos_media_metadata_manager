version: 2.1
orbs:
  lucos: lucos/deploy@0

jobs:
  test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Reject pre-release base images
          command: |
            if grep -nE '^FROM [^ ]*:[^ ]*(alpha|beta|[-.]rc[0-9])' Dockerfile; then
              echo "Pre-release base image tag(s) found above."
              echo "Pre-release images ship straight to production via auto-merge and are not covered by any runtime test."
              exit 1
            fi
      - setup_remote_docker
      - run:
          name: Run tests
          command: docker compose --profile test up test --build --exit-code-from test

workflows:
  version: 2
  build-deploy:
    jobs:
      - test
      - lucos/build:
          serial-group: << pipeline.project.slug >>/build/<< pipeline.git.branch >>
      - lucos/deploy-avalon:
          serial-group: deploy-avalon
          requires:
            - test
            - lucos/build
          filters:
            branches:
              only:
                - main
