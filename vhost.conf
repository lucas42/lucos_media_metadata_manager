<VirtualHost *:80>
	DocumentRoot /srv/metadata_manager/html
	DirectoryIndex index.php

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	## Uncomment to help debug really tricky stuff
	#LogLevel warn rewrite:trace8

	<Directory /srv/metadata_manager/html>
		Require all granted
		## Catches uncaught PHP fatals before Apache's core would otherwise send an
		## empty-bodied 500 — ErrorDocument alone can't reach these under mod_php.
		## See src/fatalhandler.php.
		php_admin_value auto_prepend_file "/srv/metadata_manager/fatalhandler.php"
	</Directory>
	RewriteEngine On
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteRule ^/tracks[/$] /tracks.php
	RewriteRule ^/collections[/$] /collections.php
	RewriteRule ^/albums[/$] /albums.php
	RewriteRule ^/artists[/$] /artists.php
	RewriteRule ^/icon /icon.png
	RewriteRule ^/([^\.]+)$ /$1.php [NC,L]
	ErrorDocument 404 /404.php
	ErrorDocument 500 /500.php
</VirtualHost>